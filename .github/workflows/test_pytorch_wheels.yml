name: Test PyTorch Wheels

on:
  workflow_dispatch:
    inputs:
      amdgpu_family:
        description: GPU family to test
        required: true
        type: string
        default: "gfx94X-dcgpu"
      test_runs_on:
        description: Runner label to use. The selected runner should have a GPU supported by amdgpu_family
        required: true
        type: string
        default: "linux-mi325-1gpu-ossci-rocm"
      package_index_url:
        description: Base Python package index URL to test, typically nightly/dev URL with a "v2" or "v2-staging" subdir (without a GPU family subdir)
        required: true
        type: string
        default: "https://rocm.nightlies.amd.com/v2"
      python_version:
        required: true
        type: string
        default: "3.12"
      torch_version:
        description: torch package version to install. (e.g. "2.7.1+rocm7.10.0a20251120")
        required: true
        type: string
      pytorch_git_ref:
        description: PyTorch ref to checkout test sources from. (e.g. "nightly", or "release/2.7")
        type: string
        default: "release/2.7"

  workflow_call:
    inputs:
      amdgpu_family:
        required: true
        type: string
      test_runs_on:
        required: true
        type: string
      package_index_url:
        required: true
        type: string
      python_version:
        required: true
        type: string
      torch_version:
        required: true
        type: string
      pytorch_git_ref:
        type: string
        default: "release/2.7"
      repository:
        description: "Repository to checkout. Otherwise, defaults to `github.repository`."
        type: string
      ref:
        description: "Branch, tag or SHA to checkout. Defaults to the reference or SHA that triggered the workflow."
        type: string

permissions:
  contents: read

run-name: Test PyTorch (${{ inputs.amdgpu_family }}, ${{ inputs.torch_version}}, ${{ inputs.test_runs_on }})

jobs:
  # Defuses https://github.com/ROCm/TheRock/issues/4926.
  #
  # On self-hosted Linux runners that use a `container:` block, the actions
  # runner calls `docker network create github_network_<id>` for every job.
  # If a previous job left behind orphan containers / networks (e.g. because a
  # containerd-shim got stuck and `docker rm --force` reports
  # "could not kill container: tried to kill container, but did not receive an
  # exit event"), each leaked network keeps a /16 from Docker's default address
  # pool. Once ~30 of those leak the pool is exhausted and the next job fails
  # with: `Error response from daemon: all predefined address pools have been
  # fully subnetted` followed by `Value cannot be null. (Parameter 'network')`.
  #
  # This pre-job runs on the same runner label *without* a `container:` block,
  # so it executes on the host before the runner attempts the failing
  # `docker network create`. It removes orphan containers and prunes networks
  # from previous jobs, reclaiming address-pool space.
  prepare_runner:
    name: Prepare runner | ${{ inputs.amdgpu_family }}
    runs-on: ${{ inputs.test_runs_on }}
    if: ${{ contains(inputs.test_runs_on, 'linux') }}
    timeout-minutes: 5
    steps:
      - name: Reclaim Docker address pool from orphan containers/networks
        shell: bash
        run: |
          set -u
          if ! command -v docker >/dev/null 2>&1; then
            echo "docker not present on runner host; nothing to clean."
            exit 0
          fi
          if ! docker info >/dev/null 2>&1; then
            echo "docker daemon unreachable from runner; skipping cleanup."
            exit 0
          fi

          echo "::group::Docker state before cleanup"
          docker ps -a --format 'table {{.ID}}\t{{.Names}}\t{{.Status}}' || true
          docker network ls || true
          echo "::endgroup::"

          # 1. Remove exited / created / dead containers that hold network
          #    endpoints. (Running containers are left alone.)
          stale_containers=$(docker ps -a \
            --filter status=exited \
            --filter status=created \
            --filter status=dead -q || true)
          if [ -n "${stale_containers}" ]; then
            echo "Removing stale containers:"
            echo "${stale_containers}"
            docker rm -f ${stale_containers} || true
          fi

          # 2. Prune unused networks.
          docker network prune --force || true

          # 3. Belt-and-braces: explicitly remove anything still named like a
          #    GHA job network. These are what consume the default address
          #    pool when leaked.
          gha_nets=$(docker network ls --format '{{.Name}}' \
            | grep -E '^github_network_' || true)
          if [ -n "${gha_nets}" ]; then
            echo "Removing leftover GHA job networks:"
            echo "${gha_nets}"
            echo "${gha_nets}" | xargs -r -n1 docker network rm || true
          fi

          echo "::group::Docker state after cleanup"
          docker ps -a --format 'table {{.ID}}\t{{.Names}}\t{{.Status}}' || true
          docker network ls || true
          echo "::endgroup::"

          # 4. Probe the address pool by creating and removing a throwaway
          #    network. If this fails, the pool is exhausted by something we
          #    cannot remove (typically an unkillable container holding a
          #    network) and the host needs operator intervention.
          probe="therock_pool_probe_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          if ! docker network create "${probe}" >/dev/null 2>err.log; then
            echo "::error::Docker address pool exhausted on this runner."
            echo "::error::docker network create failed: $(cat err.log)"
            echo "::error::Stale containers (often a wedged containerd-shim)"
            echo "::error::are holding bridge networks that cannot be removed."
            echo "::error::Operator action required on the runner host:"
            echo "::error::  sudo systemctl restart docker"
            echo "::error::See ROCm/TheRock issue #4926 for context."
            cat err.log || true
            exit 1
          fi
          docker network rm "${probe}" >/dev/null || true
          echo "Address pool probe OK."

  test_wheels:
    name: Test PyTorch | ${{ inputs.amdgpu_family }}
    needs: [prepare_runner]
    # Proceed when prepare_runner succeeded *or* was skipped (non-linux
    # runners). Do not proceed when it failed: that means the runner host is
    # unhealthy and the GHA `docker network create` step would just emit the
    # cryptic "Value cannot be null. (Parameter 'network')" error.
    if: ${{ always() && (needs.prepare_runner.result == 'success' || needs.prepare_runner.result == 'skipped') }}
    runs-on: ${{ inputs.test_runs_on }}
    container:
      image: ${{ contains(inputs.test_runs_on, 'linux') && 'ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:405945a40deaff9db90b9839c0f41d4cba4a383c1a7459b28627047bf6302a26' || null }}
      options: --ipc host
        --group-add video
        --device /dev/kfd
        --device /dev/dri
        --group-add 992
        --group-add 110
        --env-file /etc/podinfo/gha-gpu-isolation-settings
        --user 0:0 # Running as root, by recommendation of GitHub: https://docs.github.com/en/actions/reference/workflows-and-actions/dockerfile-support#user
    defaults:
      run:
        shell: bash
    env:
      VENV_DIR: ${{ github.workspace }}/.venv
      AMDGPU_FAMILY: ${{ inputs.amdgpu_family }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || '' }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ inputs.python_version }}

      # TODO: also upload and reference test report together with this logging?
      - name: Summarize workflow inputs
        run: |
          python build_tools/github_actions/summarize_test_pytorch_workflow.py \
            --torch-version=${{ inputs.torch_version }} \
            --pytorch-git-ref=${{ inputs.pytorch_git_ref }} \
            --index-url=${{ inputs.package_index_url }} \
            --index-subdir=${{ inputs.amdgpu_family }}

      - name: Set git options
        run: |
          git config --global core.longpaths true

      # Here we checkout the same version of PyTorch that wheels were built from
      # so we have the right set of test source files. We _probably_ don't need
      # to run HIPIFY or apply any patches, so we skip those steps to save time.
      - name: Checkout PyTorch Source Repos from nightly branch
        if: ${{ (inputs.pytorch_git_ref == 'nightly') }}
        run: |
          python external-builds/pytorch/pytorch_torch_repo.py checkout \
            --gitrepo-origin https://github.com/pytorch/pytorch.git \
            --repo-hashtag nightly \
            --no-hipify

      - name: Checkout PyTorch Source Repos from stable branch
        if: ${{ (inputs.pytorch_git_ref != 'nightly') }}
        run: |
          python external-builds/pytorch/pytorch_torch_repo.py checkout \
            --gitrepo-origin https://github.com/ROCm/pytorch.git \
            --repo-hashtag ${{ inputs.pytorch_git_ref }} \
            --no-hipify

      - name: Set up virtual environment
        run: |
          python build_tools/setup_venv.py ${VENV_DIR} \
            --packages torch==${{ inputs.torch_version }} \
            --index-url=${{ inputs.package_index_url }} \
            --index-subdir=${{ inputs.amdgpu_family }} \
            --activate-in-future-github-actions-steps

      - name: Install test requirements
        run: |
          python -m pip install -r external-builds/pytorch/requirements-test.txt
          pip freeze

      - name: Run rocm-sdk sanity tests
        run: |
          rocm-sdk test

      - name: Run PyTorch smoketests
        run: |
          python ./external-builds/pytorch/run_pytorch_smoke_tests.py -- \
            --log-cli-level=INFO \
            -v

      - name: Run PyTorch tests
        run: |
          python ./external-builds/pytorch/run_pytorch_tests.py -- \
            --continue-on-collection-errors \
            --import-mode=importlib \
            -v
